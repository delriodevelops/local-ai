<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wire AI models into flows that run entirely in your browser." />
    <meta name="theme-color" content="#f2f2ef" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>MeshMind</title>
    <script>
      // Aplica el tema guardado antes del primer pintado, para que el modo oscuro no destelle en claro.
      // Lee lo mismo que src/ui/theme.ts: el ajuste 'theme' del estado persistido de zustand
      // Sin acceso al almacenamiento (bloqueado por el navegador) se sigue el tema del sistema
      let theme
      try { theme = JSON.parse(localStorage.getItem('meshmind'))?.state?.theme } catch {}
      const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      if (dark) document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#111111')
    </script>
    <script>
      // Activa el aislamiento entre orígenes (hilos en WebAssembly) con un service worker.
      // El worker vive en la raíz de la web, así que controla también la landing y esta página.
      // Las cabeceras solo cuentan desde la carga siguiente a que el worker controle la página, así que
      // se espera a que esté activo y se recarga una vez. Si el worker ya sirvió esta carga y aun así no hay
      // aislamiento (Safari e iOS no admiten COEP credentialless), recargar no lo arregla.
      // La marca de la pestaña evita un bucle si algo se salta el worker (recarga forzada, "Bypass for network")
      if (self.crossOriginIsolated) sessionStorage.removeItem('isolation-reload')
      else if (window.isSecureContext && 'serviceWorker' in navigator) {
        const controlled = !!navigator.serviceWorker.controller
        navigator.serviceWorker.register('%BASE_URL%isolation-sw.js')
          .then(() => navigator.serviceWorker.ready)
          .then(() => {
            if (controlled || sessionStorage.getItem('isolation-reload')) return
            sessionStorage.setItem('isolation-reload', '1')
            location.reload()
          })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
