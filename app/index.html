<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wire AI models into flows that run entirely in your browser." />
    <meta name="theme-color" content="#0b0c09" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>MeshMind</title>
    <script>
      // Activa el aislamiento entre orígenes (hilos en WebAssembly) con un service worker.
      // El worker vive en la raíz de la web, así que controla también la landing y esta página.
      // Las cabeceras solo cuentan desde la carga siguiente a que el worker controle la página, así que
      // se espera a que esté activo y se recarga. Como mucho dos veces por pestaña, para no entrar en bucle
      // si el navegador no admite el aislamiento.
      if (!self.crossOriginIsolated && window.isSecureContext && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('%BASE_URL%isolation-sw.js')
          .then(() => navigator.serviceWorker.ready)
          .then(() => {
            const reloads = Number(sessionStorage.getItem('isolation-reloads') || 0)
            if (reloads < 2) {
              sessionStorage.setItem('isolation-reloads', String(reloads + 1))
              location.reload()
            }
          })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
